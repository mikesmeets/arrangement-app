{% extends "base.html" %}
{% block title %}{{ title }} — TreBlooms{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="card">
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn" style="margin-top:1rem;">Save</button>
    <a class="btn btn-secondary" href="{% url 'subscription-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
