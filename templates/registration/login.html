{% extends "base.html" %}
{% block title %}Log in — TreBlooms{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:3rem auto;">
  <h1 style="text-align:center;">🌸 TreBlooms</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <p class="errorlist">Incorrect username or password.</p>
    {% endif %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autofocus required>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required>
    <button type="submit" class="btn" style="width:100%;margin-top:1rem;">Log in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
