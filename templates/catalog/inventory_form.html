{% extends "base.html" %}
{% block title %}Add Inventory — TreBlooms{% endblock %}
{% block content %}
<h1>Add Inventory</h1>
<p class="muted">Saved as a one-line invoice — invoices are what stock is derived from.</p>
<div class="card">
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn" style="margin-top:1rem;">Save</button>
    <a class="btn btn-secondary" href="{% url 'inventory-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
